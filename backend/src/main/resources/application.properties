spring.application.name=budget-travel-backend

spring.datasource.url=jdbc:mysql://localhost:3306/budget_travel_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=your_mysql_password
