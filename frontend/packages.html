<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Packages</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<header><div class="container"><nav><a class="logo" href="index.html">BudgetTravel</a></nav></div></header>
<main class="container">
  <h1>Travel Packages</h1>
  <form id="filter-form" class="filters">
    <input id="keyword" placeholder="Search keyword">
    <input id="location" placeholder="Location">
    <input id="maxPrice" type="number" min="1" placeholder="Max Price">
    <select id="minRating">
      <option value="">Min Rating</option>
      <option value="3">3+</option>
      <option value="4">4+</option>
      <option value="4.5">4.5+</option>
    </select>
    <button class="btn" type="submit">Apply Filters</button>
  </form>

  <section id="package-results" class="card-grid"></section>
</main>

<script src="js/api.js"></script>
<script src="js/packages.js"></script>
</body>
</html>
