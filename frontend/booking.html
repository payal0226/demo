<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book Package</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<header><div class="container"><nav><a class="logo" href="index.html">BudgetTravel</a></nav></div></header>
<main class="container">
  <section class="form-card">
    <h2>Book Your Trip</h2>
    <form id="booking-form">
      <div class="form-group"><label>Package ID</label><input id="packageId" type="number" required></div>
      <div class="form-group"><label>No. of Travelers</label><input id="travelers" type="number" min="1" required></div>
      <div class="form-group"><label>Travel Date</label><input id="travelDate" type="date" required></div>
      <button class="btn" type="submit">Confirm Booking</button>
    </form>
    <p id="message" class="message"></p>
  </section>
</main>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/booking.js"></script>
</body>
</html>
