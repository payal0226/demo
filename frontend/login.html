<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login / Register</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<header><div class="container"><nav><a class="logo" href="index.html">BudgetTravel</a></nav></div></header>
<main class="container" style="display:grid; grid-template-columns: repeat(auto-fit,minmax(300px,1fr)); gap:1rem;">
  <section class="form-card">
    <h2>Login</h2>
    <form id="login-form">
      <div class="form-group"><label>Email</label><input id="login-email" type="email" required></div>
      <div class="form-group"><label>Password</label><input id="login-password" type="password" required></div>
      <button class="btn" type="submit">Login</button>
    </form>
  </section>

  <section class="form-card">
    <h2>Register</h2>
    <form id="register-form">
      <div class="form-group"><label>Full Name</label><input id="reg-name" required></div>
      <div class="form-group"><label>Email</label><input id="reg-email" type="email" required></div>
      <div class="form-group"><label>Password</label><input id="reg-password" type="password" minlength="6" required></div>
      <button class="btn" type="submit">Register</button>
    </form>
  </section>
</main>
<div class="container"><p id="message" class="message"></p></div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/login.js"></script>
</body>
</html>
